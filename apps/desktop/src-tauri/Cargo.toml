[package]
name = "owl-agent"
version = "0.1.0"
license = "GPL-3.0-only"
homepage = "https://portfolio.oyinlola.site/"
repository = "https://github.com/oyinlola-tech/owl-agent"
description = "OWL desktop app"
authors = ["Oluwayemi Oyinlola"]
edition = "2021"

[lib]
name = "owl_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-shell = "2.4.0"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-deep-link = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "=0.3.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.0", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
