name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create or reuse the draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id" | head -n 1)
          if [ -z "$release_id" ]; then
            release_id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="OWL ${RELEASE_TAG}" \
              -f body="Installers for Windows, macOS and Linux. See docs/INSTALL.md. These builds are NOT code-signed or notarized yet. Verify downloads with SHA256SUMS.txt." \
              -F draft=true \
              --jq .id)
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            bundles: msi,nsis
          - name: macOS Apple silicon
            runner: macos-latest
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: deb,appimage,rpm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the OWL service sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/agent "pyinstaller==6.16.0"
          python services/agent/packaging/buildServiceBinary_packaging.py
          ls -l apps/desktop/src-tauri/binaries

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build installers and attach them to a draft release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

  checksums:
    name: Publish stable-name copies and SHA256SUMS.txt
    needs: [create-release, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - name: Download every versioned release asset
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID" || { echo "No release id"; exit 1; }
          mkdir assets
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name != "SHA256SUMS.txt") | select(.name | startswith("OWL-Agent-") | not) | [.id, .name] | @tsv' \
            > asset-list.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "assets/${asset_name}"
          done < asset-list.tsv
          ls -l assets

      - name: Copy each installer to its stable file name
        run: |
          set -euo pipefail
          mkdir stable
          missing=0
          while read -r versioned_suffix stable_name; do
            matches=()
            for candidate in assets/*"${versioned_suffix}"; do
              [ -f "$candidate" ] && matches+=("$candidate")
            done
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one asset ending in '${versioned_suffix}' for ${stable_name}, found ${#matches[@]}"
              missing=1
              continue
            fi
            cp -- "${matches[0]}" "stable/${stable_name}"
            echo "${matches[0]#assets/} -> ${stable_name}"
          done <<'STABLE_NAMES'
          _x64-setup.exe OWL-Agent-Setup-x64.exe
          _x64_en-US.msi OWL-Agent-x64.msi
          _aarch64.dmg OWL-Agent-macOS-AppleSilicon.dmg
          _x64.dmg OWL-Agent-macOS-Intel.dmg
          _amd64.AppImage OWL-Agent-Linux-x64.AppImage
          _amd64.deb OWL-Agent-Linux-x64.deb
          .x86_64.rpm OWL-Agent-Linux-x64.rpm
          STABLE_NAMES
          test "$missing" -eq 0 || { echo "Some installers are missing; not publishing stable names."; exit 1; }

      - name: Hash versioned and stable files
        run: |
          set -euo pipefail
          cp -- stable/* assets/
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt

      - name: Upload stable copies and SHA256SUMS.txt to the same release
        run: |
          set -euo pipefail
          release_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)
          gh release upload "$release_tag" stable/* SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish the release
    needs: [create-release, checksums]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - run: |
          set -euo pipefail
          test -n "$RELEASE_ID" || { echo "No release id"; exit 1; }
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --jq .tag_name
