name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  BANDIT_VERSION: "1.9.4"
  SEMGREP_VERSION: "1.180.0"
  PIP_AUDIT_VERSION: "2.10.1"
  CARGO_AUDIT_VERSION: "0.22.2"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_IMAGE: "aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e"

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Bandit
        run: python -m pip install "bandit==${BANDIT_VERSION}"
      - name: Report every finding
        run: bandit -r services/agent/app -c security/scanners/banditConfig.scan.yaml --exit-zero
      - name: Fail on high severity
        run: >-
          bandit -r services/agent/app -c security/scanners/banditConfig.scan.yaml
          --severity-level high --confidence-level medium

  semgrep:
    name: Semgrep (registry packs + OWL rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Semgrep
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"
      - name: Scan and fail on ERROR severity findings
        env:
          SEMGREP_SEND_METRICS: "off"
        run: >-
          semgrep scan --metrics off --error --severity ERROR
          --config p/python --config p/typescript --config p/react --config p/secrets
          --config security/scanners/owlRules.semgrep.yml
          --exclude node_modules --exclude target --exclude .venv --exclude dist
          services apps/desktop/src apps/desktop/src-tauri/src scripts

  pip-audit:
    name: pip-audit (backend dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the backend into a clean environment
        run: |
          python -m venv /tmp/owl-audit
          /tmp/owl-audit/bin/python -m pip install --upgrade pip
          /tmp/owl-audit/bin/python -m pip install ./services/agent
      - name: Audit installed packages
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          PIPAPI_PYTHON_LOCATION=/tmp/owl-audit/bin/python pip-audit --progress-spinner off

  npm-audit:
    name: npm audit (desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit the lockfile and fail on high severity
        run: npm audit --package-lock-only --audit-level=high

  cargo-audit:
    name: cargo-audit (Tauri shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}"
      - name: Audit Cargo.lock
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  gitleaks:
    name: Gitleaks (history + tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install a checksum-verified gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
      - name: Scan git history
        run: /tmp/gitleaks git --redact --config security/scanners/gitleaksConfig.scan.toml .
      - name: Scan the checked-out tree
        run: /tmp/gitleaks dir --redact --config security/scanners/gitleaksConfig.scan.toml .

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Scan dependencies, misconfigurations and secrets
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/src:ro" "${TRIVY_IMAGE}"
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs /src/apps/desktop/node_modules --skip-dirs /src/apps/desktop/src-tauri/target
          /src
