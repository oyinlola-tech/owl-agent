[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "owl-agent-service"
version = "0.1.0"
description = "OWL Agent Python backend foundation (Phase 2). No tools execute in this phase."
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Oluwayemi Oyinlola" }]
dependencies = [
  "anthropic==1.13.0",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "pathspec==1.1.1",
  "platformdirs==4.13.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://portfolio.oyinlola.site/"
Repository = "https://github.com/oyinlola-tech/owl-agent"
Issues = "https://github.com/oyinlola-tech/owl-agent/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "schemathesis==4.31.0", "hypothesis==6.169.0"]
browser = ["playwright==1.63.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
